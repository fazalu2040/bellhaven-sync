name: Bellhaven Daily Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CRM_BASE_URL: https://analyst-assessment-production.up.railway.app/api/v1
      CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
      BELLHAVEN_BASE_URL: https://analyst-assessment-production.up.railway.app
      APP_DB_PATH: ./data/bellhaven_sync.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sync pipeline
        run: python -m app.main sync
